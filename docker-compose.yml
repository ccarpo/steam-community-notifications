services:
  steam-feed-notifier:
    build: .
    command: ["--config", "/config/config.yaml", "watch"]
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      STEAM_LOGIN_SECURE: "${STEAM_LOGIN_SECURE:-}"
      STEAM_FEED_STATE_FILE: /state/seen.json
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./state:/state
