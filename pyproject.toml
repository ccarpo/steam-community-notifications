[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-feed-notifier"
version = "0.1.0"
description = "Poll Steam's private friend activity feed and send push notifications."
requires-python = ">=3.10"
dependencies = ["requests", "beautifulsoup4", "apprise", "PyYAML"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
steam-feed-notifier = "steam_feed_notifier.cli:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
